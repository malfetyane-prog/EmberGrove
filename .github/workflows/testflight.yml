# Builds Ember Grove on a GitHub-hosted Mac, runs the unit tests, and (once Apple
# credentials are configured) uploads the build to TestFlight. No Mac needed.
#
# Repository settings → Secrets and variables → Actions:
#   Variables: APPLE_TEAM_ID, BUNDLE_ID          (e.g. ABCDE12345, com.yourname.embergrove)
#   Secrets:   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (full text of the .p8 file)
name: Build & TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Use your bundle ID and App Group
        if: env.BUNDLE_ID != ''
        run: |
          grep -rl 'com\.example\.embergrove' project.yml Shared | xargs sed -i '' "s/com\.example\.embergrove/${BUNDLE_ID}/g"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile and run unit tests (simulator)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          echo "Testing on simulator $DEVICE_ID"
          xcodebuild test \
            -project EmberGrove.xcodeproj -scheme EmberGrove \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Check TestFlight setup
        id: setup
        run: |
          if [ -n "$BUNDLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The app compiled and tests passed. Add the Apple variables and secrets (see TESTFLIGHT.md) to upload to TestFlight."
          fi

      - name: Install App Store Connect API key
        if: steps.setup.outputs.ready == 'true'
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive (signed automatically by Apple)
        if: steps.setup.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EmberGrove.xcodeproj -scheme EmberGrove -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/EmberGrove.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} -quiet

      - name: Upload to TestFlight
        if: steps.setup.outputs.ready == 'true'
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/EmberGrove.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple finishes processing (usually 5–15 minutes)."
